name: GPUI Rust 1:1 compatibility (QA only)

on:
  workflow_dispatch:
  # Validate Rust/GPUI changes before they reach the alpha branch, not only
  # after a merge. Limit to the same sources already covered by push QA.
  pull_request:
    branches:
      - feat/rust-gpui-agent-alpha-20261115
    paths:
      - 'rust/slicebridge-alpha/**'
      - 'rust/3mf-probe/**'
      - 'tests/nozzle-parity/**'
      - 'tests/nozzle-parity-check.cjs'
      - 'native/frontend/dist/brand-icon.png'
      - 'native/frontend/dist/slicebridge-banner.png'
      - '.github/workflows/gpui-parity.yml'
  push:
    branches:
      - feat/rust-gpui-agent-alpha-20261115
    paths:
      - 'rust/slicebridge-alpha/**'
      - 'rust/3mf-probe/**'
      - 'tests/nozzle-parity/**'
      - 'tests/nozzle-parity-check.cjs'
      - 'native/frontend/dist/brand-icon.png'
      - 'native/frontend/dist/slicebridge-banner.png'
      - '.github/workflows/gpui-parity.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: Rust GPUI QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust/slicebridge-alpha
        shell: bash
    steps:
      - name: Checkout source (does not touch installed stable application)
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Use stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Verify format, Rust tests and native GPUI build
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --features desktop --lib --bin slicebridge-desktop
          cargo build --locked --features desktop --bin slicebridge-desktop
      - name: Go toolchain for read-only baseline nozzle inspection
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache: false
      - name: Compare original Go and Rust source nozzle results (read-only)
        working-directory: .
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/slicebridge-alpha/Cargo.toml --bin slicebridge-alpha
          node tests/nozzle-parity-check.cjs
      - name: Build and stage matching Rust conversion engine beside GPUI QA executable
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path ../3mf-probe/Cargo.toml --target-dir ../3mf-probe/target
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=".exe"; fi
          mkdir -p target/gpui-qa
          cp "target/debug/slicebridge-desktop${suffix}" target/gpui-qa/
          cp "../3mf-probe/target/release/slicebridge-3mf-probe${suffix}" target/gpui-qa/
          test -s "target/gpui-qa/slicebridge-desktop${suffix}"
          "target/gpui-qa/slicebridge-3mf-probe${suffix}" ../../tests/fixtures/bambu-one-color.3mf | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{const r=JSON.parse(s); if(!r.ok || !(r.facts?.triangles>0)) process.exit(1);});'
      - name: Retain isolated Windows QA desktop and engine, not a release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: slicebridge-gpui-qa-windows
          path: rust/slicebridge-alpha/target/gpui-qa/
          retention-days: 3
          if-no-files-found: error
      - name: Retain isolated macOS QA desktop and engine, not a release
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: slicebridge-gpui-qa-macos
          path: rust/slicebridge-alpha/target/gpui-qa/
          retention-days: 3
          if-no-files-found: error
